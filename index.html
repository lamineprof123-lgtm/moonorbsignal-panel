<!doctype html><html><head><meta charset="utf-8"><title>MOON SIGNALS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#02030a;color:#e6f7ff;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,255,.035) 0 1px,transparent 1px 3px)}
.top{display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap;border-bottom:1px solid rgba(0,229,255,.25);background:rgba(4,10,24,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.clock{font-family:Orbitron,monospace;font-size:24px;font-weight:800;color:#7df9ff;text-shadow:0 0 10px #00e5ff99;font-variant-numeric:tabular-nums}.clock small{font-size:11px;color:#5d8aa8;font-weight:500;margin-left:6px}
.set{color:#8fb8d0;font-size:13px;letter-spacing:.5px}.mode{font-size:11px;font-weight:700;color:#00e5ff;letter-spacing:2px;text-shadow:0 0 8px #00e5ff}.mode.d{color:#fbbf24;text-shadow:0 0 8px #fbbf24}
.r{margin-left:auto;display:flex;gap:8px}.btn{background:rgba(0,229,255,.06);color:#9fe8ff;border:1px solid rgba(0,229,255,.35);border-radius:6px;padding:6px 10px;cursor:pointer;font:12px 'JetBrains Mono',monospace;box-shadow:0 0 8px rgba(0,229,255,.15) inset}
.levs{display:none;gap:3px;padding:6px 24px;justify-content:flex-end}.levs.on{display:flex}
.levs button{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);color:#9fe8ff;padding:4px 8px;border-radius:4px;cursor:pointer;font:11px 'JetBrains Mono',monospace}.levs button.on{background:#00b8d4;color:#001;box-shadow:0 0 10px #00e5ff}
.warn{color:#ff6b6b;font-size:12px;text-align:right;padding:0 24px 6px;display:none}
.rows{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px max(24px,6vw) 18px;min-height:0;max-width:1180px;width:100%;margin:0 auto}
.row{flex:1;min-height:88px;max-height:150px;display:grid;grid-template-columns:42% 29% 29%;border:1.5px solid rgba(160,190,210,.45);border-radius:14px;overflow:hidden;background:rgba(10,20,40,.35);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);box-shadow:0 0 14px rgba(0,229,255,.08),inset 0 0 20px rgba(0,229,255,.05);position:relative}
.row:before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-left:2px solid #00e5ff;border-top:2px solid #00e5ff;border-radius:14px 0 0 0;opacity:.8}
.id{background:rgba(255,255,255,.04);color:#e6f7ff;padding:6px 22px;display:flex;flex-direction:column;justify-content:center;font-family:Orbitron,monospace;font-weight:800;line-height:1.15}
.id .n{font-size:22px;letter-spacing:1px}.id .d{font-size:24px}.id .x{font-size:18px;color:#7df9ff;text-shadow:0 0 8px #00e5ff88}
.d.LONG{color:#39ff6a;text-shadow:0 0 10px #39ff6a99}.d.SHORT{color:#ff3344;text-shadow:0 0 10px #ff334499}.d.WAIT{color:#9aa7b2}
.b{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Orbitron,monospace;font-weight:800;font-size:22px;letter-spacing:1.5px;text-align:center;line-height:1.25;border-left:1px solid rgba(0,229,255,.25);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.b small{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;opacity:.95;letter-spacing:.5px}
.grey{background:rgba(140,150,160,.32)}.go{background:rgba(40,230,70,.82);box-shadow:inset 0 0 24px #b6ffc4}.in{background:rgba(60,170,80,.68)}.hold{background:rgba(255,170,0,.8)}.now{background:rgba(255,20,40,.88);animation:bl .8s infinite}.done{background:rgba(100,110,120,.5)}
@keyframes bl{50%{background:rgba(110,0,10,.9)}}
.row.GO{border-color:#39ff6a;box-shadow:0 0 22px #39ff6a88}.row.IN{border-color:#4caf50}.row.HOLD{border-color:#ffaa00;box-shadow:0 0 16px #ffaa0066}.row.NOW{border-color:#ff1a2a;box-shadow:0 0 24px #ff1a2aaa}
.tag{font-size:11px;border:1.5px solid #fff;border-radius:4px;padding:1px 7px;margin-top:4px}
@media(max-width:760px){.row{grid-template-columns:1fr 1fr;border-radius:12px;min-height:auto;max-height:none}.id{grid-column:1/3;flex-direction:row;gap:12px;align-items:baseline;flex-wrap:wrap;padding:8px 14px}
.id .n,.id .d,.id .x{font-size:16px}.b{font-size:16px;padding:11px 4px;border-left:none;border-top:1px solid rgba(0,229,255,.25)}.b small{font-size:11px}.rows{padding:8px 10px 12px;gap:8px}.top{padding:8px 12px}.clock{font-size:20px}}
</style></head><body>
<canvas id="bg"></canvas><script>
(()=>{const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),stars=[],nodes=[],run=true,t0=performance.now();
const mob=()=>innerWidth<760;
function init(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
 stars=Array.from({length:mob()?110:220},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.9+0.1,p:Math.random()*6.28}));
 const N=mob()?26:48;nodes=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,p:Math.random()*6.28,lit:0}))}
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
function frame(now){if(!run)return;const t=(now-t0)/1000;x.clearRect(0,0,W,H);
 let g=x.createRadialGradient(W*.75,H*.25,0,W*.75,H*.25,Math.max(W,H)*.6);g.addColorStop(0,'rgba(90,40,160,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 g=x.createRadialGradient(W*.2,H*.8,0,W*.2,H*.8,Math.max(W,H)*.5);g.addColorStop(0,'rgba(0,120,170,.18)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of stars){const sx=(s.x+t*4*s.z-mx*30*s.z)%W,sy=s.y-my*30*s.z,a=.35+.65*Math.abs(Math.sin(t*1.3+s.p));x.fillStyle=`rgba(220,240,255,${a*s.z})`;x.fillRect(sx<0?sx+W:sx,sy,s.z*1.6,s.z*1.6)}
 const sweep=((t*0.12)%1.3-.15)*W;
 for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;if(Math.abs(n.x-sweep)<30)n.lit=1;n.lit*=.985}
 const R=mob()?140:170;x.lineWidth=1;
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<R){const l=Math.max(a.lit,b.lit),al=(1-d/R)*(.12+.5*l);x.strokeStyle=`rgba(0,229,255,${al})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
   if(l>.3){const k=(t*1.5+i*.37)%1;x.fillStyle=`rgba(180,255,255,${l*.8})`;x.fillRect(a.x+(b.x-a.x)*k-1,a.y+(b.y-a.y)*k-1,2,2)}}}
 for(const n of nodes){const r=1.6+Math.sin(t*2+n.p)*.6+n.lit*2.5;x.fillStyle=`rgba(${120+135*n.lit|0},255,255,${.45+.5*n.lit})`;x.shadowColor='#00e5ff';x.shadowBlur=6+12*n.lit;x.beginPath();x.arc(n.x,n.y,r,0,6.28);x.fill()}x.shadowBlur=0;
 g=x.createLinearGradient(sweep-80,0,sweep+6,0);g.addColorStop(0,'rgba(0,229,255,0)');g.addColorStop(1,'rgba(0,229,255,.16)');x.fillStyle=g;x.fillRect(sweep-80,0,86,H);x.fillStyle='rgba(125,249,255,.55)';x.fillRect(sweep+5,0,1.5,H);
 requestAnimationFrame(frame)}
addEventListener('resize',init);document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)requestAnimationFrame(frame)});
init();requestAnimationFrame(frame)})();
</script>
<div class="top"><div class="clock" id="clock">--:--:--<small>Dubai</small></div><div class="set" id="set"></div><div class="mode" id="mode"></div>
<div class="r"><button class="btn" id="sound">🔔 Enable alerts</button><button class="btn" id="gear" title="Leverage">⚙</button></div></div>
<div class="levs" id="levs"></div><div class="warn" id="warn"></div>
<div class="rows" id="grid"></div>
<script>
const P=new URLSearchParams(location.search);let lev=+(P.get('lev')||localStorage.lev||375);const AT=P.get('at');
const LEVS=[250,300,350,375,400,450,500];let seen=JSON.parse(localStorage.seen||'{}'),snd=false,cfg=null;
function levBtns(){document.getElementById('levs').innerHTML=LEVS.map(l=>`<button class="${l==lev?'on':''}" onclick="setLev(${l})">${l}x</button>`).join('')}
function setLev(l){lev=l;localStorage.lev=l;levBtns();load()}levBtns();
document.getElementById('gear').onclick=()=>document.getElementById('levs').classList.toggle('on');
document.getElementById('sound').onclick=()=>{snd=true;if(window.Notification)Notification.requestPermission();beep(660);document.getElementById('sound').textContent='🔔 On'};
function beep(f){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start();setTimeout(()=>{o.frequency.value=f*1.5},180);setTimeout(()=>o.stop(),420)}catch(e){}}
function notify(k,t){if(seen[k])return;seen[k]=1;localStorage.seen=JSON.stringify(seen);if(!snd)return;beep(t.startsWith('CLOSE')?440:880);if(window.Notification&&Notification.permission=='granted')new Notification('MOON SIGNALS',{body:t})}
const tag=h=>!h?'':/Profit/.test(h)?'TP':/Loss/.test(h)?'SL':'TIME';
const NAMES={GOLD:'GOLD XAUUSD',SILVER:'SILVER XAGUSD',OIL:'OIL WTI',SPX:'S&P500 SPX',EURUSD:'EUR/USD'},ORDER=['GOLD','SILVER','OIL','SPX','EURUSD'];
function tile(s){const t=s.trade,TS=cfg.time_stop_min;let dir='WAIT',rc='',en=['grey','PENDING<br>WAIT'],cl=['grey','CLOSE<br>WAIT'];
 const nm=NAMES[s.sym]||s.label;
 if(t&&t.side&&s.status!='DONE')dir=t.side;
 switch(s.status){
  case 'ENTRY':case 'IN TRADE':{const left=Math.max(0,s.secs_left||0),el=TS*60-left;notify(s.id+'e',`${t.side} ${nm}`);
   if(el<=150){rc='GO';en=['go','CONFIRMED<br>GO']}else{rc='IN';en=['in','IN<br>TRADE']}
   if(rc=='IN')rc='HOLD';cl=['hold',`CLOSE<br>HOLD<small>${Math.ceil(left/60)}m left</small>`];break}
  case 'CLOSE NOW':rc='NOW';en=['in','IN<br>TRADE'];cl=['now',`CLOSE<br>NOW<small>${tag(t&&t.how)||'TIME'}</small>`];notify(s.id+'c',`CLOSE ${nm}`);break;
  case 'DONE':if(t&&t.side){en=['done','ENTERED'];cl=['done',`DONE${t.how?`<span class="tag">${tag(t.how)}</span>`:''}`]}else{en=['grey','NO SIGNAL<br>TODAY']}break;
 }
 return `<div class="row ${rc}"><div class="id"><span class="n">${nm}</span><span class="d ${dir}">${dir}</span><span class="x">x${lev}</span></div><div class="b ${en[0]}">${en[1]}</div><div class="b ${cl[0]}">${cl[1]}</div></div>`}
async function load(){try{const j=await (await fetch('signals.json?t='+Date.now())).json();if(j.error)throw j.error;cfg=j.cfg;
 document.getElementById('clock').innerHTML=j.now.slice(11,19)+'<small>Dubai</small>';
 document.getElementById('set').textContent=`${lev}x · AP $${j.cfg.auto_profit} · AL $${j.cfg.auto_loss} · ${j.cfg.time_stop_min}m`;
 const m=document.getElementById('mode');m.textContent=j.demo?'● DEMO':'● LIVE';m.className='mode'+(j.demo?' d':'');
 const gap=(1-j.cfg.auto_loss/j.cfg.wager)/lev*100,w=document.getElementById('warn');w.style.display=gap<0.1?'block':'none';w.textContent=`⚠ ${lev}x: Auto Loss too close to liquidation`;
 document.getElementById('grid').innerHTML=ORDER.map(k=>j.symbols.find(x=>x.sym==k)).filter(Boolean).map(tile).join('');
}catch(e){document.getElementById('set').textContent='Error: '+e}}
load();setInterval(load,30000);
</script></body></html>
