{const n=90*K|0,p=new Float32Array(n*6),f=new Float32Array(n*2),s=new Float32Array(n*2);

<div class="top"><div class="mode" id="mode"></div><div class="tz" id="tz"></div></div>
<div class="rows" id="grid"></div>
<script>
const NAMES={GOLD:['GOLD','XAUUSD'],SILVER:['SILVER','XAGUSD'],OIL:['OIL','WTI'],SPX:['S&P500','SPX'],EURUSD:['EUR/USD','EURUSD']},ORDER=['GOLD','SILVER','OIL','SPX','EURUSD'];
const RULE={GOLD:'60m range breakout',SILVER:'60m range breakout',OIL:'5m range fade (VWAP side)',SPX:'15m range fade',EURUSD:'15m range breakout'};
const TZ=(new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type=='timeZoneName')||{}).value||'';
let J=null;
const NOW=()=>Date.now()+(window.__off||0);
const T=iso=>iso?Date.parse(iso):NaN;
const hm=ms=>new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',hour12:true});
const day=ms=>{const d=new Date(ms),n=new Date(NOW());return d.toDateString()==n.toDateString()?hm(ms):d.toLocaleDateString([], {weekday:'short'})+' '+hm(ms)};
function dur(s){s=Math.max(0,Math.floor(s));const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0,x=s%60;return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m ${String(x).padStart(2,'0')}s`:`${m}m ${String(x).padStart(2,'0')}s`}
const sg=v=>v>=0?'+':'−';
const mv=(v,fx)=>v==null||isNaN(v)?'—':fx?sg(v)+(Math.abs(v)*1e4).toFixed(1)+' pips':sg(v)+Math.abs(v).toFixed(2)+' pts';
const pc=v=>v==null||isNaN(v)?'':sg(v)+Math.abs(v).toFixed(2)+'%';
const px=(v,fx)=>v==null?'—':(+v).toFixed(fx?5:2);
function howTxt(h){h=h||'';return /Profit/.test(h)?'target hit':/Loss/.test(h)?'stop hit':/min/.test(h)?'time exit':h||'closed'}
// ---- normalise every signal source into one card model ----
function fromOrb(s){const t=s.trade||{},n=NOW(),fx=s.sym=='EURUSD',sd=t.side=='LONG'?1:-1,[nm,tk]=NAMES[s.sym];
 const u={key:s.sym,name:nm,ticker:tk,fx,proven:!!s.proven,rule:RULE[s.sym],bt:s.bt,live:s.live,endTxt:s.proven?'20 min after start':'tested exit'};
 const cb=T(s.close_by_iso)||(T(t.t_in_iso)+((J.cfg&&J.cfg.time_stop_min)||45)*60e3),st=s.status;
 if(t.side&&t.t_in_iso){u.dir=sd>0?'UP':'DOWN';u.t0=T(t.t_in_iso);u.entry=t.entry;
  u.t1=s.proven?u.t0+20*60e3:cb;
  if(t.exit!=null&&t.t_out_iso){u.ended=true;u.t1=T(t.t_out_iso);u.exit=t.exit;u.mv=sd*(t.exit-t.entry);u.why=howTxt(t.how)}
  else if(st=='CLOSE NOW'||n>=u.t1){u.ended=true;u.exit=s.price;u.mv=sd*(s.price-t.entry);u.why='time exit'}
  else{u.ended=false;u.mv=sd*(s.price-t.entry)}
  u.pct=u.mv/t.entry*100}
 const w=s.win||{},ef=T(w.entry_from),eu=T(w.entry_until);
 if(/WAITING|ARMED|PRE-SESSION/.test(st)&&ef-n<12*3600e3&&eu>n)u.watch={from:ef,until:eu,txt:n<ef?null:(s.watch||'Watching for the range signal')};
 const c=[ef,T(s.fire&&!s.fire.actual&&s.fire.t),T(s.next_session)].filter(x=>x>n);u.next=c.length?Math.min(...c):NaN;
 const h=(J.history||[]).filter(x=>x.sym==(s.sym=='EURUSD'?'EUR/USD':s.sym)&&x.side&&x.exit!=null)[0];if(h)u.last=(h.side=='LONG'?1:-1)*(h.exit-h.entry);
 return u}
function fromWave(w){const n=NOW(),c=w.cur,u={key:w.id,name:w.name.toUpperCase(),ticker:w.ticker,fx:false,proven:w.proven,rule:w.label,endTxt:'end rule',
 bt:{period:w.backtest.period,horizon:20,hit_rate:w.backtest.hit_rate,signals:w.backtest.signals,avg_pts:w.backtest.avg_pts},live:w.live,last:w.last&&w.last.move_pts};
 if(c){u.dir=c.dir;u.t0=T(c.t_start);u.t1=T(c.t_end);u.entry=c.entry;u.ended=c.ended;u.mv=c.move_pts;u.pct=c.move_pct;u.exit=c.exit;u.why=c.end_reason}
 if(w.watch&&n>=T(w.watch.from)&&n<T(w.watch.until))u.watch={from:T(w.watch.from),until:T(w.watch.until),txt:'Watching for a big 3m candle'};
 u.next=T(w.next_fire);return u}
function stats(u){const b=u.bt,l=u.live||{};let a='';
 if(b)a=`Backtest ${b.period}: right <b>${Math.round(b.hit_rate*100)}%</b> of the time ${b.horizon} min after the start, ${b.signals} signals, avg <b>${mv(b.avg_pts,u.fx)}</b> per signal after spread${b.base_hit!=null?` (any day at that time: ${Math.round(b.base_hit*100)}%)`:''}`;
 const lv=l.signals?`Live record: <b>${l.signals}</b> signal${l.signals>1?'s':''}, right <b>${Math.round(l.hit_rate*100)}%</b>, avg ${mv(l.avg_pts,u.fx)}`:'Live record: no signals yet';
 return `<div class="stt">${a}<br>${lv}</div>`}
function nameH(u){return `<span class="nm">${u.name}<span class="tk">${u.ticker}</span></span>${u.proven?'':'<span class="utag">Unproven – tracking</span>'}`}
function phase(u){const n=NOW();if(u.dir&&!u.ended)return 'GO';if(u.dir&&u.ended&&n-u.t1<30*60e3)return 'STOP';if(u.watch)return 'WAIT';return 'IDLE'}
function card(u){const n=NOW(),ph=phase(u),mu=u.proven?'':' mu';
 if(ph=='GO'){const L=u.dir=='UP';
  return `<div class="row ${L?'L':'S'}${mu}"><div class="hd">${nameH(u)}<span class="pill" style="color:${L?'#39ff6a':'#ff5566'};border-color:currentColor">${L?'▲ UP':'▼ DOWN'}</span></div>
  <div class="act"><div class="big">GO ${L?'LONG':'SHORT'}</div><div class="rk">Move started <b style="color:#e6f7ff">${hm(u.t0)}</b> at ${px(u.entry,u.fx)} · now <b class="${u.mv>=0?'pos':'neg'}">${mv(u.mv,u.fx)} ${pc(u.pct)}</b></div></div>
  <div class="meta"><span>Start <b>${hm(u.t0)}</b></span><span>Move end (${u.endTxt}) <b>${hm(u.t1)}</b> · <b class="cd">${dur((u.t1-n)/1000)}</b> left</span></div>${stats(u)}</div>`}
 if(ph=='STOP')
  return `<div class="row R${mu}"><div class="hd">${nameH(u)}<span class="pill">${u.dir=='UP'?'▲ UP':'▼ DOWN'}</span></div>
  <div class="res"><span class="st">STOP</span><span class="how">Move ended · ${u.why||'closed'}<br><span style="color:#7fa8bd;font-size:11.5px">${hm(u.t0)} → ${hm(u.t1)} · ${px(u.entry,u.fx)} → ${px(u.exit,u.fx)}</span></span><span class="pnl ${u.mv>=0?'pos':'neg'}">${mv(u.mv,u.fx)}<br><span style="font-size:12px">${pc(u.pct)}</span></span></div>${stats(u)}</div>`;
 if(ph=='WAIT'){const w=u.watch,line=n<w.from?`Signal window opens <b>${day(w.from)}</b> · <b class="cd">${dur((w.from-n)/1000)}</b>`:`${w.txt} until <b>${hm(w.until)}</b>`;
  return `<div class="row W${mu}"><div class="hd">${nameH(u)}<span class="pill">WAIT</span></div><div class="sub">${u.rule} · ${line}</div>${stats(u)}</div>`}
 const lr=u.last!=null?`<span class="lr">last ${mv(u.last,u.fx)}</span>`:'';
 return `<div class="row I${mu}"><div class="hd">${nameH(u)}<span class="nx">${isNaN(u.next)?'Next signal —':`Next signal in <b class="cd">${dur((u.next-n)/1000)}</b>`}${lr}</span></div>${stats(u)}</div>`}
const RANK={GO:0,STOP:1,WAIT:2,IDLE:3};
function render(){if(!J)return;const m=document.getElementById('mode'),age=(NOW()-Date.parse(J.now))/1000;
 if(J.demo){m.textContent='● DEMO';m.className='mode d'}else if(age>600){m.textContent='● OFFLINE';m.className='mode off'}else if(age>180){m.textContent='● STALE';m.className='mode d'}else{m.textContent='● LIVE';m.className='mode'}
 const U=[...ORDER.map(k=>J.symbols.find(x=>x.sym==k)).filter(Boolean).map(fromOrb),...(J.waves||[]).map(fromWave)];
 const S=U.map((u,i)=>({u,r:RANK[phase(u)]*100+(u.proven?0:50)+i})).sort((a,b)=>a.r-b.r);
 document.getElementById('grid').innerHTML=S.map(o=>card(o.u)).join('')}
async function load(){try{const j=await (await fetch((window.__src||'signals.json')+'?t='+Date.now())).json();if(j.error)throw j.error;J=j;render()}catch(e){const m=document.getElementById('mode');m.textContent='● OFFLINE';m.className='mode off'}}
{const q=new URLSearchParams(location.search);if(q.get('at'))window.__off=Date.parse(q.get('at'))-Date.now();if(q.get('src'))window.__src=q.get('src')}
document.getElementById('tz').textContent=TZ;load();setInterval(load,30000);setInterval(render,1000);
</script></body></html>
