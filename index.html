<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('bg'),mobile=matchMedia('(max-width:700px)').matches,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const K=mobile?.45:1,DEP=60.,SPEED=RM?.5:2.;
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1:1.25));renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,1,.1,200);
const U={time:{value:0},pr:{value:renderer.getPixelRatio()},spd:{value:SPEED},dep:{value:DEP}};
const R=Math.random,rnd=(a,b)=>a+R()*(b-a);
let CL=[];function wall(){if(CL.length&&R()<.6){const q=CL[R()*CL.length|0];return[q[0]+rnd(-.5,.5),q[1]+rnd(-.5,.5)]}
 const s=R()*4|0,u=rnd(-1.1,1.1)*5,o=5*(1+Math.pow(R(),2)*1.2);return s==0?[u,-o*.75]:s==1?[u,o*.75]:s==2?[-o,u*.75]:[o,u*.75]}
CL=Array.from({length:50},wall);
const ZF=`float zz(float z0){return -mod(z0-time*spd,dep)-.5;}`;
const soft=`void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;gl_FragColor=vec4(vCol,vA*smoothstep(.5,0.,d));}`;
function pts(n,fill,vs,fs,blend){const p=new Float32Array(n*3),s=new Float32Array(n);for(let i=0;i<n;i++){const v=fill(i);p.set(v.slice(0,3),i*3);s[i]=v[3]}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('seed',new THREE.BufferAttribute(s,1));
 const m=new THREE.ShaderMaterial({uniforms:U,vertexShader:vs,fragmentShader:fs,transparent:true,depthWrite:false,blending:blend||THREE.AdditiveBlending});const o=new THREE.Points(g,m);o.frustumCulled=false;scene.add(o);return o}
// wall particles (motion on GPU)
pts(2600*K|0,()=>{const[a,b]=wall();return[a,b,R()*DEP,R()]},`uniform float time,pr,spd,dep;attribute float seed;varying vec3 vCol;varying float vA;${ZF}
void main(){float z=zz(position.z);vec4 mv=modelViewMatrix*vec4(position.xy,z,1.);gl_Position=projectionMatrix*mv;float d=-z;
 vA=smoothstep(.5,4.,d)*smoothstep(dep,dep*.6,d)*(.55+.45*sin(time*1.3+seed*40.));vCol=mix(vec3(.05,.65,1.),vec3(.6,.95,1.),step(.88,seed))*1.4;
 gl_PointSize=pr*(1.+seed*1.4)*11./d;}`,`varying vec3 vCol;varying float vA;${soft}`);
// portal ring
pts(900*K|0,()=>{const s=R()*4|0,u=rnd(-1,1),j=()=>rnd(-.1,.1)*(1+R()*2);let[a,b]=s==0?[u+j(),-1+j()]:s==1?[u+j(),1+j()]:s==2?[-1+j(),u+j()]:[1+j(),u+j()];return[a*4.2,b*3.4,-34,R()]},
 `uniform float time,pr;attribute float seed;varying vec3 vCol;varying float vA;void main(){float p=1.+.04*sin(time*.8);vec4 mv=modelViewMatrix*vec4(position.xy*p,position.z,1.);gl_Position=projectionMatrix*mv;
 vA=.55+.45*sin(time*2.+seed*50.);vCol=vec3(.35,.9,1.)*1.5;gl_PointSize=pr*(1.2+seed)*30./-mv.z;}`,`varying vec3 vCol;varying float vA;${soft}`);
// radial light lines (parallel to the tunnel axis -> radiate from the centre in perspective), flowing pulse in shader
{const n=90*K|0,p=new Float32Array(n*6),f=new Float32Array(n*2),s=new Float32Array(n*2);
 for(let i=0;i<n;i++){const a=R()*6.283,r=rnd(1.5,9),x=Math.cos(a)*r,y=Math.sin(a)*r*.75,z0=-rnd(2,10),z1=-rnd(30,55),q=R();p.set([x,y,z0,x,y,z1],i*6);f.set([0,1],i*2);s.set([q,q],i*2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('f',new THREE.BufferAttribute(f,1));g.setAttribute('seed',new THREE.BufferAttribute(s,1));
 const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`uniform float time;attribute float f,seed;varying float vF,vS;void main(){vF=f;vS=seed;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform float time;varying float vF,vS;void main(){float pulse=pow(.5+.5*sin((vF*6.-time*.6)+vS*30.),6.);float a=(.02+.09*vS)*(1.-vF)*(.35+.65*pulse);gl_FragColor=vec4(.15,.75,1.,a*1.3);}`});
 const o=new THREE.LineSegments(g,m);o.frustumCulled=false;scene.add(o)}
const NODES=[];
// neural links between wall nodes: move with the tunnel, signal pulse travels along each link
{const n=520*K|0,p=new Float32Array(n*6),f=new Float32Array(n*2),s=new Float32Array(n*2);
 for(let i=0;i<n;i++){const[a,b]=wall(),z=R()*DEP,q=R();const q2=wall();const e=[a+(q2[0]-a)*.25+rnd(-.8,.8),b+(q2[1]-b)*.25+rnd(-.8,.8)];p.set([a,b,z,e[0],e[1],z+rnd(-3,3)],i*6);NODES.push([a,b,z],[e[0],e[1],z]);f.set([0,1],i*2);s.set([q,q],i*2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('f',new THREE.BufferAttribute(f,1));g.setAttribute('seed',new THREE.BufferAttribute(s,1));
 const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`uniform float time,spd,dep;attribute float f,seed;varying float vF,vS,vD;${ZF}
 void main(){vF=f;vS=seed;float base=zz(position.z-f*0.)+0.;float z=-mod(position.z-time*spd,dep)-.5;vD=-z;gl_Position=projectionMatrix*modelViewMatrix*vec4(position.xy,z,1.);}`,
 fragmentShader:`uniform float time,dep,act;varying float vF,vS,vD;void main(){float h=fract(time*.3+vS*7.);float pulse=smoothstep(.12,0.,abs(vF-h));float a=smoothstep(.5,4.,vD)*smoothstep(dep,dep*.5,vD)*(.07+.9*pulse);gl_FragColor=vec4(.2,.85,1.,a);}`});
 const o=new THREE.LineSegments(g,m);o.frustumCulled=false;scene.add(o)}
// neural nodes at link ends
pts(NODES.length,i=>[...NODES[i],Math.random()],`uniform float time,pr,spd,dep;attribute float seed;varying vec3 vCol;varying float vA;${ZF}
void main(){float z=zz(position.z);vec4 mv=modelViewMatrix*vec4(position.xy,z,1.);gl_Position=projectionMatrix*mv;float d=-z;
 vA=smoothstep(.5,4.,d)*smoothstep(dep,dep*.5,d)*(.35+.65*pow(.5+.5*sin(time*1.6+seed*60.),4.));vCol=vec3(.4,.92,1.)*1.6;gl_PointSize=pr*(2.+seed*2.)*14./d;}`,`varying vec3 vCol;varying float vA;${soft}`);
// dark data blocks on the walls (normal blending, square sprites)
pts(60*K|0,()=>{const[a,b]=wall();return[a,b,R()*DEP,R()]},`uniform float time,pr,spd,dep;attribute float seed;varying float vA,vS;${ZF}
void main(){float z=zz(position.z);vec4 mv=modelViewMatrix*vec4(position.xy,z,1.);gl_Position=projectionMatrix*mv;float d=-z;vS=seed;vA=smoothstep(.8,4.,d)*smoothstep(dep,dep*.5,d);gl_PointSize=pr*(1.+seed*2.5)*140./d;}`,
 `varying float vA,vS;void main(){vec2 c=abs(gl_PointCoord-.5);if(c.y>.22+vS*.2)discard;float e=step(.47,c.x)+step(.2+vS*.2,c.y);gl_FragColor=e>0.?vec4(.3,.8,1.,.13*vA):vec4(.0,.01,.02,(vS>.6?.3:.65)*vA);}`,THREE.NormalBlending);
// foreground bokeh near the edges
pts(28*K|0,()=>{let x=rnd(-1,1),y=rnd(-1,1);if(Math.abs(x)<.45&&R()<.75)x=Math.sign(x||1)*rnd(.45,1);return[x*5.5,y*3.6,-rnd(3,7),R()]},
 `uniform float time,pr;attribute float seed;varying vec3 vCol;varying float vA;void main(){vec3 p=position;p.y+=sin(time*.15+seed*20.)*.25;vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
 vA=(.05+.14*seed)*(.7+.3*sin(time*.5+seed*9.));vCol=vec3(.1,.75,1.);gl_PointSize=pr*(6.+seed*18.)*6./-mv.z;}`,`varying vec3 vCol;varying float vA;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(vCol,vA*smoothstep(.5,.25,d));}`);
// dark core behind the portal
{const m=new THREE.Mesh(new THREE.PlaneGeometry(7,5.6),new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec2 v;void main(){float d=length(v-.5)*2.;gl_FragColor=vec4(.0,.005,.01,.9*smoothstep(1.,.3,d));}`}));m.position.z=-34.5;scene.add(m)}
{const m=new THREE.Mesh(new THREE.PlaneGeometry(60,45),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform float time;varying vec2 v;void main(){vec2 q=(v-.5)*vec2(1.3,1.);float d=max(abs(q.x),abs(q.y));float r=exp(-pow((d-.075)*22.,2.))*.5+exp(-length(q)*7.)*.22;r*=smoothstep(.5,.25,max(abs(v.x-.5),abs(v.y-.5)));gl_FragColor=vec4(.1,.7,1.,r*2.*(.85+.15*sin(time*.8)));}`}));m.position.z=-40;scene.add(m)}

// ---- scanner orbs ----
const ORB_N=mobile?60:110,OZ=-12,oP=new Float32Array(ORB_N*3),oF=new Float32Array(ORB_N),oS=new Float32Array(ORB_N),OB=[];
for(let i=0;i<ORB_N;i++){OB.push({x:rnd(-1,1),y:rnd(-1,1),vx:rnd(-.02,.02),vy:rnd(-.02,.02),ph:R()*6.28,f:0});oS[i]=R()}
const oG=new THREE.BufferGeometry();oG.setAttribute('position',new THREE.BufferAttribute(oP,3));oG.setAttribute('flash',new THREE.BufferAttribute(oF,1));oG.setAttribute('seed',new THREE.BufferAttribute(oS,1));
const orbs=new THREE.Points(oG,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`uniform float time,pr;attribute float flash,seed;varying float vF,vT;void main(){vF=flash;vT=(.6+.4*sin(time*1.1+seed*30.))*smoothstep(55.,40.,-position.z);vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=pr*(6.+seed*6.+flash*22.)*18./-mv.z;}`,
 fragmentShader:`varying float vF,vT;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;float core=smoothstep(.35,0.,d),glow=pow(1.-d,2.5);float ring=vF*smoothstep(.12,0.,abs(d-(1.-vF)*.9-.08));
 vec3 c=mix(vec3(.2,.8,1.),vec3(.85,1.,1.),vF);gl_FragColor=vec4(c,(core*.9+glow*.45)*(.55+.45*vT)*(.7+vF)+ring*.9);}`}));orbs.frustumCulled=false;scene.add(orbs);
// scan beam (screen-space wedge sweeping from the centre)
const beam=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:Object.assign(U,{ang:{value:0},asp:{value:1}}),transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,
 vertexShader:`varying vec2 v;void main(){v=position.xy;gl_Position=vec4(position.xy,0.,1.);}`,
 fragmentShader:`uniform float ang,asp;varying vec2 v;void main(){vec2 p=v*vec2(asp,1.);float a=atan(p.y,p.x);float d=mod(ang-a,6.28318);float r=length(p);
 float trail=exp(-d*3.2)*.22+smoothstep(.02,0.,d)*.35;float fade=smoothstep(0.,.12,r)*smoothstep(1.9,.4,r);gl_FragColor=vec4(.15,.8,1.,trail*fade);}`}));
// lock-on line from centre to the scanned orb
const ZN=4,lP=new Float32Array(ZN*6),lA=new Float32Array(ZN*2),lG=new THREE.BufferGeometry();lG.setAttribute('position',new THREE.BufferAttribute(lP,3));lG.setAttribute('al',new THREE.BufferAttribute(lA,1));const ZP=Array.from({length:ZN},()=>({i:-1,t:0}));
const lM=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`attribute float al;varying float vA;void main(){vA=al;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying float vA;void main(){gl_FragColor=vec4(.7,.97,1.,vA);}`});const lockL=new THREE.LineSegments(lG,lM);lockL.frustumCulled=false;scene.add(lockL);
// bright central core
pts(1,()=>[0,0,-30,0],`uniform float time,pr;varying float vA;varying vec3 vCol;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;vA=.85+.15*sin(time*1.7);vCol=vec3(.5,.95,1.);gl_PointSize=pr*170.;}`,
 `varying vec3 vCol;varying float vA;void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;gl_FragColor=vec4(vCol,vA*(pow(1.-d,3.)*.9+smoothstep(.12,0.,d)));}`);
let prevA=0,lockT=0,lockI=-1;
function spawn(o,z){o.th=R()*Math.PI*2;o.r=rnd(2.5,9);o.z=z;o.v=rnd(2.2,3.6);o.f=0;o.done=false}
OB.forEach(o=>spawn(o,-rnd(4,55)));
let nextZap=0;
function scan(dt,t){
 for(let i=0;i<ORB_N;i++){const o=OB[i];o.z+=o.v*dt*(RM?.3:1);if(o.z>-1.5)spawn(o,-55);
  oP[i*3]=Math.cos(o.th)*o.r*1.3;oP[i*3+1]=Math.sin(o.th)*o.r;oP[i*3+2]=o.z;
  if(!o.done&&o.z>-6){zap(i)}
  o.f=Math.max(0,o.f-dt*.9);oF[i]=o.f}
 nextZap-=dt;if(nextZap<=0){nextZap=rnd(.15,.9)*(RM?3:1);const n=R()<.25?2+(R()*2|0):1;for(let k=0;k<n;k++){const c=[];for(let i=0;i<ORB_N;i++){const o=OB[i];if(!o.done&&o.z>-40)c.push(i)}if(c.length)zap(c[R()*c.length|0])}}
 for(let k=0;k<ZN;k++){const z=ZP[k];z.t=Math.max(0,z.t-dt*3.2);const a=z.t*z.t;lA[k*2]=a;lA[k*2+1]=a*.9;if(z.i>=0)lP.set([0,0,-30,oP[z.i*3],oP[z.i*3+1],oP[z.i*3+2]],k*6)}
 oG.attributes.position.needsUpdate=true;oG.attributes.flash.needsUpdate=true;lG.attributes.position.needsUpdate=true;lG.attributes.al.needsUpdate=true}
function zap(i){const o=OB[i];o.done=true;o.f=1;let k=0;for(let q=1;q<ZN;q++)if(ZP[q].t<ZP[k].t)k=q;ZP[k].i=i;ZP[k].t=1}
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',size);size();
const clock=new THREE.Clock();let lt=0;const loop=()=>{U.time.value=clock.getElapsedTime();const dt=Math.min(.05,U.time.value-lt);lt=U.time.value;scan(dt,U.time.value);camera.position.x=Math.sin(U.time.value*.05)*.3;camera.position.y=Math.cos(U.time.value*.04)*.2;renderer.render(scene,camera)};
renderer.setAnimationLoop(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden){renderer.setAnimationLoop(null);clock.stop()}else{clock.start();renderer.setAnimationLoop(loop)}});
</script>

<div class="rows" id="grid"></div>
<script>
const P=new URLSearchParams(location.search);let lev=375;const AT=P.get('at');
const LEVS=[250,300,350,375,400,450,500];let seen=JSON.parse(localStorage.seen||'{}'),snd=false,cfg=null;
function levBtns(){return;document.getElementById('levs').innerHTML=LEVS.map(l=>`<button class="${l==lev?'on':''}" onclick="setLev(${l})">${l}x</button>`).join('')}
function setLev(l){lev=l;localStorage.lev=l;levBtns();load()}levBtns();
if(0)document.getElementById('gear').onclick=()=>document.getElementById('levs').classList.toggle('on');
if(0)document.getElementById('sound').onclick=()=>{snd=true;if(window.Notification)Notification.requestPermission();beep(660);document.getElementById('sound').textContent='🔔 On'};
function beep(f){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start();setTimeout(()=>{o.frequency.value=f*1.5},180);setTimeout(()=>o.stop(),420)}catch(e){}}
function notify(k,t){if(seen[k])return;seen[k]=1;localStorage.seen=JSON.stringify(seen);if(!snd)return;beep(t.startsWith('CLOSE')?440:880);if(window.Notification&&Notification.permission=='granted')new Notification('MOON SIGNALS',{body:t})}
const tag=h=>!h?'':/Profit/.test(h)?'TP':/Loss/.test(h)?'SL':'TIME';
const NAMES={GOLD:'GOLD XAUUSD',SILVER:'SILVER XAGUSD',OIL:'OIL WTI',SPX:'S&P500 SPX',EURUSD:'EUR/USD'},ORDER=['GOLD','SILVER','OIL','SPX','EURUSD'];
const TZ=(new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type=='timeZoneName')||{}).value||'';
function ft(s){const f=s.fire;if(!f||!f.t)return '';const h=new Date(f.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',hour12:true});return `<span class="tm${f.actual?' a':''}">${f.actual?'':'~'}${h}</span>`}
function tile(s){const t=s.trade,TS=cfg.time_stop_min;let dir='WAIT',rc='',en=['grey','PENDING<br>WAIT'],cl=['grey','CLOSE<br>WAIT'];
 const nm=NAMES[s.sym]||s.label;
 if(t&&t.side&&s.status!='DONE')dir=t.side;
 switch(s.status){
  case 'ENTRY':case 'IN TRADE':{const left=Math.max(0,s.secs_left||0),el=TS*60-left;notify(s.id+'e',`${t.side} ${nm}`);
   if(el<=150){rc='GO';en=['go','CONFIRMED<br>GO']}else{rc='IN';en=['in','IN<br>TRADE']}
   if(rc=='IN')rc='HOLD';cl=['hold',`CLOSE<br>HOLD<small>${Math.ceil(left/60)}m left</small>`];break}
  case 'CLOSE NOW':rc='NOW';en=['in','IN<br>TRADE'];cl=['now',`CLOSE<br>NOW<small>${tag(t&&t.how)||'TIME'}</small>`];notify(s.id+'c',`CLOSE ${nm}`);break;
  case 'DONE':if(t&&t.side){en=['done','ENTERED'];cl=['done',`DONE${t.how?`<span class="tag">${tag(t.how)}</span>`:''}`]}else{en=['grey','NO SIGNAL<br>TODAY']}break;
 }
 return `<div class="row ${rc}"><div class="id"><span class="n">${nm}</span><span class="d ${dir}">${dir}</span><span class="x">x${lev}</span><span class="rk"><b class="tp">TP $${cfg.auto_profit}</b> · <b class="sl">SL $${cfg.auto_loss}</b></span>${ft(s)}</div><div class="b ${en[0]}">${en[1]}</div><div class="b ${cl[0]}">${cl[1]}</div></div>`}
async function load(){try{const j=await (await fetch('signals.json?t='+Date.now())).json();if(j.error)throw j.error;cfg=j.cfg;
 
 
 const m=document.getElementById('mode');const age=(Date.now()-Date.parse(j.now))/1000;lev=(j.cfg&&j.cfg.leverage)||375;if(j.demo){m.textContent='● DEMO';m.className='mode d'}else if(age>600){m.textContent='● OFFLINE';m.className='mode off'}else if(age>180){m.textContent='● STALE';m.className='mode d'}else{m.textContent='● LIVE';m.className='mode'}
 
 document.getElementById('grid').innerHTML=ORDER.map(k=>j.symbols.find(x=>x.sym==k)).filter(Boolean).map(tile).join('');
}catch(e){const m=document.getElementById('mode');m.textContent='● OFFLINE';m.className='mode off'}}
document.getElementById('tz').textContent=TZ;load();setInterval(load,30000);
</script></body></html>
