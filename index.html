<!doctype html><html><head><meta charset="utf-8"><title>MOON SIGNALS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#02030a;color:#e6f7ff;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,255,.035) 0 1px,transparent 1px 3px)}
.top{display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap;border-bottom:1px solid rgba(0,229,255,.25);background:rgba(4,10,24,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.clock{font-family:Orbitron,monospace;font-size:24px;font-weight:800;color:#7df9ff;text-shadow:0 0 10px #00e5ff99;font-variant-numeric:tabular-nums}.clock small{font-size:11px;color:#5d8aa8;font-weight:500;margin-left:6px}
.set{color:#8fb8d0;font-size:13px;letter-spacing:.5px}.mode{font-size:11px;font-weight:700;color:#00e5ff;letter-spacing:2px;text-shadow:0 0 8px #00e5ff}.mode.off{color:#ff3344;text-shadow:0 0 8px #ff3344}.top{justify-content:flex-end}.mode.d{color:#fbbf24;text-shadow:0 0 8px #fbbf24}
.r{margin-left:auto;display:flex;gap:8px}.btn{background:rgba(0,229,255,.06);color:#9fe8ff;border:1px solid rgba(0,229,255,.35);border-radius:6px;padding:6px 10px;cursor:pointer;font:12px 'JetBrains Mono',monospace;box-shadow:0 0 8px rgba(0,229,255,.15) inset}
.levs{display:none;gap:3px;padding:6px 24px;justify-content:flex-end}.levs.on{display:flex}
.levs button{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.3);color:#9fe8ff;padding:4px 8px;border-radius:4px;cursor:pointer;font:11px 'JetBrains Mono',monospace}.levs button.on{background:#00b8d4;color:#001;box-shadow:0 0 10px #00e5ff}
.warn{color:#ff6b6b;font-size:12px;text-align:right;padding:0 24px 6px;display:none}
.rows{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px max(24px,6vw) 18px;min-height:0;max-width:1180px;width:100%;margin:0 auto}
.row{flex:1;min-height:88px;max-height:150px;display:grid;grid-template-columns:42% 29% 29%;border:1.5px solid rgba(160,190,210,.45);border-radius:14px;overflow:hidden;background:rgba(10,20,40,.35);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);box-shadow:0 0 14px rgba(0,229,255,.08),inset 0 0 20px rgba(0,229,255,.05);position:relative}
.row:before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-left:2px solid #00e5ff;border-top:2px solid #00e5ff;border-radius:14px 0 0 0;opacity:.8}
.id{background:rgba(255,255,255,.04);color:#e6f7ff;padding:6px 22px;display:flex;flex-direction:column;justify-content:center;font-family:Orbitron,monospace;font-weight:800;line-height:1.15}
.id .n{font-size:22px;letter-spacing:1px}.id .d{font-size:24px}.id .x{font-size:18px;color:#7df9ff;text-shadow:0 0 8px #00e5ff88}
.d.LONG{color:#39ff6a;text-shadow:0 0 10px #39ff6a99}.d.SHORT{color:#ff3344;text-shadow:0 0 10px #ff334499}.d.WAIT{color:#9aa7b2}
.b{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Orbitron,monospace;font-weight:800;font-size:22px;letter-spacing:1.5px;text-align:center;line-height:1.25;border-left:1px solid rgba(0,229,255,.25);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.b small{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;opacity:.95;letter-spacing:.5px}
.grey{background:rgba(140,150,160,.32)}.go{background:rgba(40,230,70,.82);box-shadow:inset 0 0 24px #b6ffc4}.in{background:rgba(60,170,80,.68)}.hold{background:rgba(255,170,0,.8)}.now{background:rgba(255,20,40,.88);animation:bl .8s infinite}.done{background:rgba(100,110,120,.5)}
@keyframes bl{50%{background:rgba(110,0,10,.9)}}
.row.GO{border-color:#39ff6a;box-shadow:0 0 22px #39ff6a88}.row.IN{border-color:#4caf50}.row.HOLD{border-color:#ffaa00;box-shadow:0 0 16px #ffaa0066}.row.NOW{border-color:#ff1a2a;box-shadow:0 0 24px #ff1a2aaa}
.tag{font-size:11px;border:1.5px solid #fff;border-radius:4px;padding:1px 7px;margin-top:4px}
@media(max-width:760px){.row{grid-template-columns:1fr 1fr;border-radius:12px;min-height:auto;max-height:none}.id{grid-column:1/3;flex-direction:row;gap:12px;align-items:baseline;flex-wrap:wrap;padding:8px 14px}
.id .n,.id .d,.id .x{font-size:16px}.b{font-size:16px;padding:11px 4px;border-left:none;border-top:1px solid rgba(0,229,255,.25)}.b small{font-size:11px}.rows{padding:8px 10px 12px;gap:8px}.top{padding:8px 12px}.clock{font-size:20px}}
.tm{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#7fa8bd;letter-spacing:.5px;margin-top:3px}.tm.a{color:#cfefff}.tz{font-size:10px;color:#5d8aa8;letter-spacing:1px}
@media(max-width:760px){.tm{font-size:11px;margin:0 0 0 auto}}
</style></head><body>
<canvas id="bg"></canvas><div id="vig" style="position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 62% 58% at 50% 50%,rgba(0,5,12,.38),rgba(0,5,12,.12) 72%,rgba(0,0,0,.45))"></div><script>
(()=>{const c=document.getElementById('bg'),x=c.getContext('2d');const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,D=Math.min(devicePixelRatio||1,2),run=true,last=performance.now(),cz=0,P=[],B=[],K=[],L=[],R=[];const SP=RM?.4:1.6,DEP=14;
const rnd=(a,b)=>a+Math.random()*(b-a),m=()=>innerWidth<760;
let CL=[];function wall(){if(CL.length&&Math.random()<.6){const q=CL[Math.random()*CL.length|0];return[q[0]+rnd(-.12,.12),q[1]+rnd(-.12,.12)]}const s=Math.random()*4|0,u=rnd(-1.1,1.1),o=1+Math.pow(Math.random(),2)*1.4;return s==0?[u*o,-o]:s==1?[u*o,o]:s==2?[-o*1.25,u*o]:[o*1.25,u*o]}
function init(){CL=[];CL=Array.from({length:40},()=>wall());W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);const k=m()?.45:1;
 P=Array.from({length:7000*k|0},()=>{const[a,b]=wall();return{x:a,y:b,z:rnd(0,DEP),t:Math.random()*6.28,s:Math.random()}});
 R=Array.from({length:1400*k|0},()=>{const s=Math.random()*4|0,u=rnd(-1,1),j=()=>rnd(-.09,.09)*(1+Math.random()*2);return s==0?[u+j(),-1+j()]:s==1?[u+j(),1+j()]:s==2?[-1+j(),u+j()]:[1+j(),u+j()]}).map(([a,b])=>({x:a,y:b,t:Math.random()*6.28}));
 B=Array.from({length:110*k|0},()=>{const[a,b]=wall();return{x:a,y:b,z:rnd(0,DEP),w:rnd(.2,.7),h:rnd(.1,.45),dk:Math.random()<.6}});
 L=Array.from({length:150*k|0},()=>({a:rnd(0,6.28),r0:rnd(.06,.35),r1:rnd(.5,1.3),al:rnd(.08,.32),t:Math.random()*6.28}));
 K=Array.from({length:60*k|0},()=>{const e=Math.random()<.5?rnd(0,.22):rnd(.78,1);return{x:Math.random()<.65?e:Math.random(),y:Math.random(),r:rnd(1.5,6),a:rnd(.15,.55),t:Math.random()*6.28}})}
function pr(X,Y,Z){const z=Z-cz;if(z<=.25)return null;const f=Math.min(W,H)*.3/z;return[W/2+X*f,H/2+Y*f,z]}
function frame(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;cz+=dt*SP;const t=now/1000,cx=W/2,cy=H/2,S=Math.min(W,H),M=Math.max(W,H);
 x.globalCompositeOperation='source-over';let g=x.createRadialGradient(cx,cy,0,cx,cy,M*.75);g.addColorStop(0,'#06303f');g.addColorStop(.4,'#03141f');g.addColorStop(1,'#00060b');x.fillStyle=g;x.fillRect(0,0,W,H);
 // blocks
 for(const b of B){if(b.z<cz+.3){b.z+=DEP;[b.x,b.y]=wall()}const p=pr(b.x,b.y,b.z);if(!p)continue;const f=S*.3/p[2],fd=Math.min(1,(p[2])/3)*Math.max(0,1-p[2]/DEP);
  const w=b.w*f*.5,h=b.h*f*.5;x.fillStyle=b.dk?`rgba(0,10,18,${.6*fd})`:`rgba(40,160,200,${.16*fd})`;x.fillRect(p[0]-w/2,p[1]-h/2,w,h);x.strokeStyle=`rgba(80,200,240,${.35*fd})`;x.lineWidth=.6;x.strokeRect(p[0]-w/2,p[1]-h/2,w,h)}
 x.globalCompositeOperation='lighter';
 // wall grid lines (longitudinal)
 x.lineWidth=.5;for(let i=0;i<24;i++){const a=i/24*6.28+.13;x.strokeStyle='rgba(60,190,230,.07)';x.beginPath();x.moveTo(cx+Math.cos(a)*S*.12,cy+Math.sin(a)*S*.09);x.lineTo(cx+Math.cos(a)*M,cy+Math.sin(a)*M*.8);x.stroke()}
 // radial thin light lines
 for(const l of L){const fl=.6+.4*Math.sin(t*.7+l.t),ca=Math.cos(l.a),sa=Math.sin(l.a),r0=l.r0*M,r1=l.r1*M;g=x.createLinearGradient(cx+ca*r0,cy+sa*r0,cx+ca*r1,cy+sa*r1);g.addColorStop(0,`rgba(120,230,255,${l.al*fl})`);g.addColorStop(1,'rgba(120,230,255,0)');x.strokeStyle=g;x.lineWidth=.7;x.beginPath();x.moveTo(cx+ca*r0,cy+sa*r0);x.lineTo(cx+ca*r1,cy+sa*r1);x.stroke()}
 // core glow
 g=x.createRadialGradient(cx,cy,S*.04,cx,cy,S*.32);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,'rgba(40,200,255,.16)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 // wall particles
 for(const p of P){if(p.z<cz+.3){p.z+=DEP;[p.x,p.y]=wall()}const q=pr(p.x,p.y,p.z);if(!q||q[0]<-5||q[0]>W+5||q[1]<-5||q[1]>H+5)continue;const fd=Math.min(1,q[2]/1.2)*Math.min(1,(DEP-q[2])/4),tw=.55+.45*Math.sin(t*1.5+p.t),sz=Math.min(3,.8+2/q[2]);
  x.fillStyle=`rgba(${p.s>.85?190:80},${p.s>.85?250:210},255,${.9*fd*tw})`;x.fillRect(q[0],q[1],sz,sz)}
 // portal ring (particles)
 const pu=1+.04*Math.sin(t*.8),rs=S*.17*pu;for(const p of R){const tw=.5+.5*Math.sin(t*2+p.t);x.fillStyle=`rgba(150,240,255,${.9*tw})`;x.fillRect(cx+p.x*rs*1.1,cy+p.y*rs,1.6,1.6)}
 x.shadowColor='#3fd8ff';x.shadowBlur=28;x.strokeStyle=`rgba(80,220,255,${.13+.05*Math.sin(t*.8)})`;x.lineWidth=rs*.05;x.strokeRect(cx-rs*1.1,cy-rs,rs*2.2,rs*2);x.shadowBlur=0;
 x.globalCompositeOperation='source-over';g=x.createRadialGradient(cx,cy,0,cx,cy,rs*.95);g.addColorStop(0,'rgba(2,14,22,.8)');g.addColorStop(.7,'rgba(2,14,22,.5)');g.addColorStop(1,'rgba(2,14,22,0)');x.fillStyle=g;x.fillRect(cx-rs,cy-rs,rs*2,rs*2);
 x.globalCompositeOperation='lighter';
 // bokeh
 for(const k of K){k.y=(k.y-dt*.004*SP+1)%1;const X=k.x*W,Y=k.y*H,e=Math.min(1,Math.hypot(X-cx,Y-cy)/Math.hypot(cx,cy)*1.2),r=k.r*(.6+e*1.6),a=k.a*e*(.7+.3*Math.sin(t*.6+k.t));
  g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,`rgba(90,220,255,${a})`);g.addColorStop(.6,`rgba(60,190,240,${a*.5})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(X,Y,r,0,6.28);x.fill()}
 x.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
addEventListener('resize',init);document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run){last=performance.now();requestAnimationFrame(frame)}});
init();requestAnimationFrame(frame)})();
</script>
<div class="top"><div class="mode" id="mode"></div><div class="tz" id="tz"></div></div>
<div class="rows" id="grid"></div>
<script>
const P=new URLSearchParams(location.search);let lev=375;const AT=P.get('at');
const LEVS=[250,300,350,375,400,450,500];let seen=JSON.parse(localStorage.seen||'{}'),snd=false,cfg=null;
function levBtns(){return;document.getElementById('levs').innerHTML=LEVS.map(l=>`<button class="${l==lev?'on':''}" onclick="setLev(${l})">${l}x</button>`).join('')}
function setLev(l){lev=l;localStorage.lev=l;levBtns();load()}levBtns();
if(0)document.getElementById('gear').onclick=()=>document.getElementById('levs').classList.toggle('on');
if(0)document.getElementById('sound').onclick=()=>{snd=true;if(window.Notification)Notification.requestPermission();beep(660);document.getElementById('sound').textContent='🔔 On'};
function beep(f){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start();setTimeout(()=>{o.frequency.value=f*1.5},180);setTimeout(()=>o.stop(),420)}catch(e){}}
function notify(k,t){if(seen[k])return;seen[k]=1;localStorage.seen=JSON.stringify(seen);if(!snd)return;beep(t.startsWith('CLOSE')?440:880);if(window.Notification&&Notification.permission=='granted')new Notification('MOON SIGNALS',{body:t})}
const tag=h=>!h?'':/Profit/.test(h)?'TP':/Loss/.test(h)?'SL':'TIME';
const NAMES={GOLD:'GOLD XAUUSD',SILVER:'SILVER XAGUSD',OIL:'OIL WTI',SPX:'S&P500 SPX',EURUSD:'EUR/USD'},ORDER=['GOLD','SILVER','OIL','SPX','EURUSD'];
const TZ=(new Intl.DateTimeFormat([], {timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type=='timeZoneName')||{}).value||'';
function ft(s){const f=s.fire;if(!f||!f.t)return '';const h=new Date(f.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});return `<span class="tm${f.actual?' a':''}">${f.actual?'':'~'}${h}</span>`}
function tile(s){const t=s.trade,TS=cfg.time_stop_min;let dir='WAIT',rc='',en=['grey','PENDING<br>WAIT'],cl=['grey','CLOSE<br>WAIT'];
 const nm=NAMES[s.sym]||s.label;
 if(t&&t.side&&s.status!='DONE')dir=t.side;
 switch(s.status){
  case 'ENTRY':case 'IN TRADE':{const left=Math.max(0,s.secs_left||0),el=TS*60-left;notify(s.id+'e',`${t.side} ${nm}`);
   if(el<=150){rc='GO';en=['go','CONFIRMED<br>GO']}else{rc='IN';en=['in','IN<br>TRADE']}
   if(rc=='IN')rc='HOLD';cl=['hold',`CLOSE<br>HOLD<small>${Math.ceil(left/60)}m left</small>`];break}
  case 'CLOSE NOW':rc='NOW';en=['in','IN<br>TRADE'];cl=['now',`CLOSE<br>NOW<small>${tag(t&&t.how)||'TIME'}</small>`];notify(s.id+'c',`CLOSE ${nm}`);break;
  case 'DONE':if(t&&t.side){en=['done','ENTERED'];cl=['done',`DONE${t.how?`<span class="tag">${tag(t.how)}</span>`:''}`]}else{en=['grey','NO SIGNAL<br>TODAY']}break;
 }
 return `<div class="row ${rc}"><div class="id"><span class="n">${nm}</span><span class="d ${dir}">${dir}</span><span class="x">x${lev}</span>${ft(s)}</div><div class="b ${en[0]}">${en[1]}</div><div class="b ${cl[0]}">${cl[1]}</div></div>`}
async function load(){try{const j=await (await fetch('signals.json?t='+Date.now())).json();if(j.error)throw j.error;cfg=j.cfg;
 
 
 const m=document.getElementById('mode');const age=(Date.now()-Date.parse(j.now))/1000;lev=(j.cfg&&j.cfg.leverage)||375;if(j.demo){m.textContent='● DEMO';m.className='mode d'}else if(age>600){m.textContent='● OFFLINE';m.className='mode off'}else if(age>180){m.textContent='● STALE';m.className='mode d'}else{m.textContent='● LIVE';m.className='mode'}
 
 document.getElementById('grid').innerHTML=ORDER.map(k=>j.symbols.find(x=>x.sym==k)).filter(Boolean).map(tile).join('');
}catch(e){const m=document.getElementById('mode');m.textContent='● OFFLINE';m.className='mode off'}}
document.getElementById('tz').textContent=TZ;load();setInterval(load,30000);
</script></body></html>
